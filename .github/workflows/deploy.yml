name: Web Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy
    environment: Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: src/app
        run: bun install --frozen-lockfile

      - name: Build Project
        working-directory: src/app
        run: bun run build

      - name: Upload Secrets
        working-directory: src/app
        run: |
          echo "${{ secrets.SECRET_KEY }}" | bun wrangler secret put SECRET_KEY
          echo "${{ secrets.DATABASE_URL }}" | bun wrangler secret put DATABASE_URL
          echo "${{ secrets.MEGABASE_URL }}" | bun wrangler secret put MEGABASE_URL
          echo "${{ secrets.BUCKET_ENDPOINT_URL }}" | bun wrangler secret put BUCKET_ENDPOINT_URL
          echo "${{ secrets.BUCKET_ACCESS_KEY }}" | bun wrangler secret put BUCKET_ACCESS_KEY
          echo "${{ secrets.BUCKET_SECRET_KEY }}" | bun wrangler secret put BUCKET_SECRET_KEY
          echo "${{ vars.BUCKET_NAME }}" | bun wrangler secret put BUCKET_NAME
          echo "${{ vars.BUCKET_PREFIX }}" | bun wrangler secret put BUCKET_PREFIX
          echo "${{ secrets.OPENROUTER_API_KEY }}" | bun wrangler secret put OPENROUTER_API_KEY
          echo "${{ vars.OPENROUTER_TITLE }}" | bun wrangler secret put OPENROUTER_TITLE
          echo "${{ vars.OPENROUTER_REFERER }}" | bun wrangler secret put OPENROUTER_REFERER
          echo "${{ vars.OPENROUTER_MODEL }}" | bun wrangler secret put OPENROUTER_MODEL

      - name: Deploy to Cloudflare
        working-directory: src/app
        run: bun run deploy
